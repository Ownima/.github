name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: input
    id: repository
    attributes:
      label: Repository
      placeholder: Ownima/owner-api
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Observed behavior and what you expected instead
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and context
      description: Version, environment, logs, screenshots
    validations:
      required: false
